<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Ask My Texts</title></head>
<body><main>
  <header><span class="mark">✦</span><div><h1>Ask My Texts</h1><p>Search stays on this Mac.</p></div></header>
  <form id="search-form"><label for="query">Ask about your indexed texts</label><textarea id="query" rows="3" autofocus placeholder="When did we plan dinner?"></textarea><div class="actions"><button type="submit">Search</button><button type="button" id="recent" class="secondary">Recent</button></div></form>
  <p id="status" role="status">Connecting to Ask My Texts…</p><pre id="result" hidden></pre>
</main><script src="popup.js"></script></body></html>
