<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Menu</title>
  <style>
    html, body { margin: 0; background: transparent; color: var(--menu-text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    #card {
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: transparent; border: 0; }
    .suggestion, .menu-row, .popover-foot {
      width: 100%;
      height: 36px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) minmax(72px, 42%);
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 8px;
      text-align: left;
      border-radius: 9px;
    }
    .menu-row, .popover-foot { display: flex; justify-content: space-between; height: 40px; border-radius: 0; padding: 0 14px; }
    .pad { padding: 4px; }
    .suggestion-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center; color: var(--muted); background: var(--surface-2);
    }
    strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    em { color: var(--muted); font-style: normal; font-size: 12px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggestion.selected, .suggestion:hover, .menu-row:hover, .popover-foot:hover, .icon-button:hover { background: var(--accent-soft); }
    .popover-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 4px 16px; }
    .popover-head strong { font-size: 16px; letter-spacing: -0.02em; }
    .icon-button { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
    .download-row {
      display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 8px; align-items: center;
      margin: 4px 8px; padding: 10px; border-radius: 12px; background: var(--surface-2);
    }
    .download-copy strong { display: block; white-space: normal; line-height: 1.3; max-height: 2.6em; }
    .download-copy small { color: var(--muted); font-size: 12px; }
    .popover-foot { border-top: 1px solid var(--border); font-weight: 650; margin-top: 4px; }
    .empty { margin: 0; padding: 4px 16px 12px; color: var(--muted); }
    .ext-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; }
    .ext-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; background: transparent; border: 0; color: inherit; font: inherit; }
    .ext-main strong, .ext-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ext-copy small { color: var(--muted); font-size: 12px; }
    .ext-icon { width: 24px; height: 24px; border-radius: 6px; object-fit: contain; background: var(--surface-2); }
    .ext-pin { height: 28px; padding: 0 8px; border-radius: 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .ask-preview {
      margin: 0 16px 12px;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--surface-2);
      border-radius: 10px;
      padding: 10px 12px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .ask-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 12px 12px; }
    .ask-send { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 8px 16px; font-weight: 650; }
    .download-progress { display: block; height: 3px; margin-top: 6px; border-radius: 99px; background: var(--accent); }
  
    button { cursor: pointer; border-radius: var(--button-radius); }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: -3px; background: var(--accent-soft); }
    button:active { background: var(--pressed); }
    #card, button { transition: background-color 150ms, color 150ms; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="card"></div>
  <script src="../shared/themes.js"></script>
  <script src="float.js"></script>
</body>
</html>
