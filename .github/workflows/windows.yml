name: Windows foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Exercise the Windows launcher setup
        shell: powershell
        run: ./scripts/start-windows.ps1 -SetupOnly
      - run: npm test
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: righttab-windows-unsigned-x64
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
